name: Fetch CF Data

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub's minimum; may lag a few min)
  workflow_dispatch:          # also runnable manually from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 9  # a single fetch cycle is seconds; generous cap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: fetcher
        run: pip install -r requirements.txt

      - name: Create handles.txt
        working-directory: fetcher
        run: |
          cat > handles.txt << 'EOF'
          # CF handles tracked across public contests. Keep this minimal so the
          # leaderboard is not polluted with unrelated public-contest results;
          # the orientation contest itself is pulled via contests.txt below.
          gwasafaewf3552
          EOF

      - name: Create contests.txt
        working-directory: fetcher
        run: |
          cat > contests.txt << 'EOF'
          714608
          EOF

      - name: Run fetcher
        working-directory: fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_SECRET: ${{ secrets.CF_API_SECRET }}
        run: python main.py
